name: SmartKNN Benchmarks

on:
  workflow_dispatch:
    inputs:
      pattern:
        description: "Optional benchmark filter (e.g. class, regression, set_1). Leave empty to run all."
        required: false
        default: ""

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run SmartKNN benchmarks
        run: |
          export PYTHONPATH=$(pwd)
          echo "Benchmark filter pattern: '${{ github.event.inputs.pattern }}'"
          if [ -z "${{ github.event.inputs.pattern }}" ]; then
            python benchmarks/run_benchmark.py
          else
            python benchmarks/run_benchmark.py --pattern "${{ github.event.inputs.pattern }}"
          fi

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smartknn-benchmark-results
          path: benchmarks/results/
